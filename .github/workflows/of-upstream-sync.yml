name: of-upstream-sync

# OpenFathom delta — allowed by ADR-002. Weekly sync of the `cloudrun` branch
# onto NousResearch/hermes-agent:main, so fork divergence stays bounded (the
# whole reason ADR-002 chose "fork + weekly sync" over vendoring or a submodule).
#
# Filename is `of-upstream-sync.yml`, not the `upstream-sync.yml` ADR-002 lists
# verbatim -- this repo's own .github/workflows/ already carries upstream's own
# workflow files, and an `of-` prefix means a future upstream file with the same
# short name can never collide during the weekly sync. Same reasoning as the
# `of-` prefix on every container/image/port this fork adds locally.
#
# Also deviates from ADR-002's literal wording on the success path: the ADR says
# "rebase succeeds -> push and tag the new image" (direct push to `cloudrun`).
# This opens a PR into `cloudrun` instead. PLAN.md's OF-03 task text already
# says "abre PR se o rebase for bem-sucedido" — a rebase (or, since 2026-07-27,
# a merge -- see "Attempt cloudrun merge" below) that applies cleanly can still
# be semantically wrong (upstream renaming something cloudrun-entrypoint.sh
# depends on), and a force-push straight to the branch of-build-image.yml
# builds from would skip the one human look that would catch that. Both
# deviations are flagged in docs/BACKLOG.md (openfathom-meta, ENG-32) for an
# ADR-002 wording correction — real ADR/implementation mismatches, not silent
# choices.
#
# TWO PRECONDITIONS THIS FILE CANNOT ENFORCE, both of which fail silently -- no
# red run, no alert, just nothing happening (ENG-62, measured 2026-07-18):
#
#   1. `cloudrun` must be this repo's DEFAULT BRANCH. GitHub only fires `schedule`
#      from the default branch, and this workflow lives only on `cloudrun` (ADR-002
#      forbids us touching `main`, which mirrors upstream).
#   2. This workflow must be EXPLICITLY ENABLED. "When a public repository is
#      forked, scheduled workflows are disabled by default" -- GitHub Docs. Check
#      with `gh workflow list`, enable with `gh workflow enable of-upstream-sync.yml`.
#
# Also: in a public repo, GitHub auto-disables scheduled workflows after 60 days
# with no repository activity. A quiet quarter turns this off again, silently.

on:
  schedule:
    - cron: '0 3 * * 1' # Monday 03:00 UTC
  workflow_dispatch:

# `permissions:` here governs the default GITHUB_TOKEN. The push+PR path does NOT
# use it -- it uses the App installation token minted below. `issues: write` USED
# to be declared here for the conflict path (`gh issue create`), removed 2026-07-27
# (openfathom-meta ENG-62, sixth blocker): the org disables write permissions for
# workflows with no per-repo override -- `PUT .../actions/permissions/workflow` with
# `default_workflow_permissions=write` returns `409 Conflict: "Write permissions for
# workflows are disabled by the organization"`, and an explicit `permissions:` key in
# the workflow file does NOT override that org-wide policy in this account's plan
# (measured: the declaration was already present and `gh issue create` still failed
# with `Resource not accessible by integration`). Same class of restriction as the
# PR-creation block below, just for Issues instead of Pull requests. The conflict
# path no longer needs `issues: write` at all -- see "Report conflict" below.
permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # openfathom-meta ADR-051. The FOURTH blocker ENG-62 found: GITHUB_TOKEN cannot
      # push a change to a file under `.github/workflows/`, and every upstream sync
      # touches one (`ci.yml`). `workflows` is not a valid `permissions:` scope -- it is a
      # platform restriction, not config. A GitHub App WITH the `Workflows` repository
      # permission can push workflow files; this mints a ~1h installation token from the
      # `openfathom-fork-sync` App (App ID in SYNC_APP_ID, private key in
      # SYNC_APP_PRIVATE_KEY). The token is a non-personal bot identity (closes half of
      # ENG-74) and expires on its own (no PAT-style silent-expiry failure).
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          # Check out with the App token so `git push` below authenticates as the App and
          # is allowed to push the `ci.yml` change. Without this, checkout wires the
          # default GITHUB_TOKEN into git and the push dies exactly as ENG-62 measured.
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git identity
        run: |
          git config user.name "openfathom-bot"
          git config user.email "openfathom-bot@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/NousResearch/hermes-agent.git
          git fetch upstream main

      # No `main` fast-forward step here, deliberately. This fork's `main` carries
      # one commit of ours (99d57df, the OF-01 bootstrap of README.openfathom.md,
      # which ADR-002 lists as in-scope), so it has diverged from upstream and
      # `git merge --ff-only upstream/main` ABORTS -- the sync would have died at
      # that step every single time it fired. Measured 2026-07-18 (ENG-62): the
      # merge-base of origin/main and upstream/main is not origin/main.
      #
      # The sync never needed our `main`: what it merges onto is upstream's tree,
      # and `upstream/main` names that directly. Dropping the step also drops a
      # `git push origin main` from a workflow that runs unattended on a public
      # fork -- less surface, same outcome. Our `main` simply stays frozen at the
      # OF-01 bootstrap; nothing reads it once `cloudrun` is the default branch.
      #
      # `git merge`, NOT `git rebase` (changed 2026-07-27, ENG-62 sixth blocker,
      # openfathom-meta). The previous version of this step ran
      # `git rebase upstream/main`, and it broke for a reason that had nothing to
      # do with upstream: an earlier sync PR (#34) was merged into `cloudrun` with
      # GitHub's "create a merge commit" strategy, leaving a real two-parent merge
      # commit in `cloudrun`'s history. `git log` hides one of those two parent
      # lineages by default (merge-history simplification); `git rebase` does NOT
      # simplify -- it replays every commit unique to `cloudrun`, including the
      # hidden lineage, and that replay collided with itself
      # (`CONFLICT (add/add)` in README.openfathom.md, no upstream commit involved
      # at all -- confirmed by `git log <merge-base>..upstream/main -- README.openfathom.md`
      # coming back empty). `git merge` does not replay history commit-by-commit;
      # it three-way-diffs tree state at the tips, so it is blind to whatever
      # shape `cloudrun`'s own history takes -- proven the same day, same
      # conflict, zero errors with `git merge upstream/main --no-edit` where the
      # rebase failed. This is not a one-off workaround: as long as this repo
      # allows PRs to merge into `cloudrun` as a real merge commit (the GitHub
      # default, still enabled), a future rebase-based sync would remain exposed
      # to the same class of failure. Merge is not.
      - name: Attempt cloudrun merge
        id: rebase
        run: |
          branch="sync/upstream-$(date -u +%Y%m%d)"
          git checkout -b "$branch" cloudrun
          if git merge upstream/main --no-edit; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      # PUSH ONLY -- the PR is opened by a human, deliberately (openfathom-meta ENG-62,
      # measured 2026-07-20). The App token pushes the branch (INCLUDING the upstream
      # `ci.yml` change -- the fourth blocker, now proven fixed), but `gh pr create` from
      # inside Actions is refused with `Resource not accessible by integration`: the ORG
      # policy "Allow GitHub Actions to create and approve pull requests" is OFF, and a
      # repo cannot override it (PUT returns 409). Turning it ON is org-wide and bundles
      # PR *approval* by automation -- a posture the program declined for a once-a-week
      # convenience, since the 1588-commit sync PR needs a real human review anyway. So the
      # workflow stops at the push and prints the compare link; the human clicks it. The
      # one manual step lands exactly where the human was already going to read the diff.
      # `--force-with-lease`, not a bare push: the branch name is date-derived
      # (`sync/upstream-YYYYMMDD`), so a SECOND run on the same day pushes to a ref that
      # already exists and git rejects it as non-fast-forward. Measured 2026-07-25, and it
      # is not a corner case -- it is precisely the re-run you need after merging a fix into
      # `cloudrun` that the first sync branch predates. That is the fifth structural blocker
      # this mechanism has hit (ENG-62 catalogued four).
      #
      # Force is right here because this branch is machine-owned and disposable: it is a
      # merge artifact, recreated from `cloudrun` on every run. `--force-with-lease` and
      # not `--force` because the ONE case that must not be silently discarded is a human
      # having pushed onto the sync branch to fix a semantic break in the merge; the lease
      # compares against the remote-tracking ref fetched at checkout (`fetch-depth: 0`
      # fetches it), so that push makes this step FAIL instead of overwriting the work.
      #
      # Re-pushing the same branch also keeps an already-open sync PR updating in place
      # rather than orphaning it and requiring a new one.
      - name: Push sync branch
        if: steps.rebase.outputs.conflict == 'false'
        run: |
          git push --force-with-lease origin "${{ steps.rebase.outputs.branch }}"
          echo "::notice title=Sync branch pushed::Open the PR (base cloudrun): https://github.com/${{ github.repository }}/compare/cloudrun...${{ steps.rebase.outputs.branch }}?expand=1"
          echo "Sync branch pushed. Open the PR here (base cloudrun):"
          echo "  https://github.com/${{ github.repository }}/compare/cloudrun...${{ steps.rebase.outputs.branch }}?expand=1"

      # No `gh issue create` here (removed 2026-07-27, openfathom-meta ENG-62 sixth
      # blocker): the org disables workflow write permissions with no per-repo or
      # per-workflow override, `issues: write` above never took effect, and there is
      # no in-scope fix that doesn't touch org-wide policy for every repo, not just
      # this one -- out of proportion to a once-a-week convenience notification. This
      # step instead makes the run itself the signal: a scheduled workflow run that
      # fails gets GitHub's own notification (by default, to whoever last edited this
      # file's `cron:` line) with no extra permission required, plus `::error::` and a
      # job summary a human lands on from the Actions tab.
      #
      # Remediation is push-a-branch-and-open-a-PR, NOT `git push --force-with-lease`
      # straight to `cloudrun` -- that used to be the documented fix, until the branch
      # protection ruleset (ENG-2) rejected exactly that with `GH013: Cannot force-push
      # to this branch`, measured 2026-07-27 resolving this same conflict.
      - name: Report conflict
        if: steps.rebase.outputs.conflict == 'true'
        run: |
          {
            echo "## upstream-sync: merge conflict ($(date -u +%Y-%m-%d))"
            echo
            echo "The weekly merge of \`upstream/main\` into \`cloudrun\` failed with a conflict and was aborted. Resolve manually:"
            echo
            echo '```'
            echo "git fetch upstream main"
            echo "git checkout cloudrun"
            echo "git checkout -b fix/upstream-sync-conflict"
            echo "git merge upstream/main --no-edit"
            echo "# fix conflicts, then: git add <files> && git commit"
            echo "git push origin fix/upstream-sync-conflict"
            echo "gh pr create --base cloudrun --head fix/upstream-sync-conflict"
            echo '```'
            echo
            echo "See ADR-002 (openfathom-meta) for the fork-scope rule this branch must keep obeying while resolving. Direct push to \`cloudrun\` is rejected by branch protection -- open a PR."
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::error title=upstream-sync conflict::Weekly merge of upstream/main into cloudrun failed -- see job summary for the resolve-manually steps"
